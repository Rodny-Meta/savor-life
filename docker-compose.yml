# 知味生活 本地基础设施：MySQL 8.4 + Redis 7
# 一键启停：docker compose up -d   /   docker compose down
# 端口说明：本机 3306/6379 已被 med-qa（毕业设计）容器占用，故映射 3307/6380
name: savor-life

services:
  mysql:
    image: mysql:8.4
    container_name: savor-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "12345678"
      MYSQL_DATABASE: savor_life
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - savor-mysql-data:/var/lib/mysql
      # 首次初始化自动执行建库建表（SQL 内含 CREATE DATABASE + USE）
      - ./backend/src/main/resources/db/savor_life.sql:/docker-entrypoint-initdb.d/01-savor_life.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p12345678"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g

  redis:
    image: redis:7-alpine
    container_name: savor-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "12345678"]
    ports:
      - "6380:6379"
    volumes:
      - savor-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "12345678", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

volumes:
  savor-mysql-data:
  savor-redis-data:
